[workspace]
members = [
    "cuppies/qemu-rv32-virt",
    "cuppies/ch32v003",
    "topping/qingke-v2a",
    "topping/rv32",
    "sherbet",
    "payload/idle",
]
resolver = "2"

[profile.dev]
opt-level = "z"
debug-assertions = false
overflow-checks = true
lto = "fat"
incremental = false
codegen-units = 1

[workspace.dependencies]
qingke-v2a = { path = "topping/qingke-v2a" }
rv32 = { path = "topping/rv32" }
sherbet = { path = "sherbet" }
idle = { path = "payload/idle" }
